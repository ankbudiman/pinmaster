<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squads and Lanes · Pin Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pm.css">
<style>
.ln-nav{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.ln-nav a{color:#C9D4E5;text-decoration:none;font-size:14px;font-weight:600}
.ln-nav a:hover{color:#fff;text-decoration:underline}
.ln-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ln-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.ln-stats div{background:#F6F8FB;border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.ln-stats b{display:block;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-size:34px;line-height:1}
.ln-stats span{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.ln-day{display:flex;flex-direction:column;gap:14px}
.ln-blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.ln-blk--check{border:2px solid #C88A12}
.ln-hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.ln-hd h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:26px;letter-spacing:.3px}
.ln-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ln-lane{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:22px;white-space:nowrap}
.ln-mine td{background:#FFF8EA}
.ln-miss{display:flex;flex-direction:column;gap:4px;font-size:14px}
</style>
</head>
<body>
<header class="pm-top">
  <svg width="18" height="23" viewBox="0 0 22 28" aria-hidden="true"><path d="M11 1C8.8 1 7.4 2.600 7.4 4.400c0 1.500.6 2.600 1.500 3.400C7.300 10.400 5 13.500 5 17.500c0 3 1.300 5.200 2.200 6.400.4.500.2 1.300.2 2.100h7.200c0-.8-.2-1.600.2-2.100.9-1.200 2.200-3.400 2.200-6.400 0-4-2.300-7.100-3.900-9.500.9-.8 1.500-1.900 1.500-3.400C14.600 2.600 13.200 1 11 1z" fill="#F2A93B"/></svg>
  <span class="pm-brand" style="font-size:22px">PIN MASTER</span>
  <nav class="ln-nav" aria-label="Breadcrumb"><a id="dashl" href="tournament.html">&larr; Dashboard</a></nav>
  <span class="sp"></span>
  <span id="who" style="font-size:14px;color:#C9D4E5"></span>
  <button class="pm-btn" id="out" type="button">Sign out</button>
</header>
<main class="pm-wrap">
  <div id="note" aria-live="polite"></div>
  <section class="pm-card" id="head" aria-busy="true"><p class="pm-help">Loading the lane draw…</p></section>
  <div id="warn"></div>
  <div id="days"></div>
</main>
<script src="config.js"></script>
<script src="pm.js"></script>
<script>
(function () {
  var PM = window.PM, h = PM.h;
  var sess = PM.getSession();
  if (!sess || !sess.user) { PM.goLogin(); return; }
  var user = sess.user, admin = user.role === 'admin';
  var tid = admin ? (PM.q('t') || PM.pref('tid') || '') : (user.tournament_id || '');
  if (!tid) { location.replace(admin ? 'hub.html' : 'login.html'); return; }
  if (admin) PM.pref('tid', tid);
  document.getElementById('who').textContent = user.display_name || user.login_id;
  document.getElementById('dashl').href = PM.link('tournament.html', tid);
  var D = null, busy = false, NOTE = null;

  function authFail(e) { if (e && (e.code === 'auth' || e.code === 'must_change_pin')) { PM.goLogin(true); return true; } return false; }
  function say(text, kind) { NOTE = text ? { text: text, kind: kind || 'ok' } : null; }

  // One change to the server; it answers with the fresh lane draw.
  function run(action, params, okText) {
    if (busy) return Promise.resolve();
    busy = true; say(''); paint();
    return PM.api(action, Object.assign({ tournament_id: tid }, params || {})).then(function (r) {
      D = r; busy = false;
      var t = okText(r);
      var bad = (r.results || []).filter(function (x) { return x.status === 'error'; });
      say(t + (bad.length ? ' Not drawn: ' + bad.map(function (x) { return x.name + ' (' + x.error + ')'; }).join('; ') : ''), bad.length ? 'warn' : 'ok');
      paint();
    }).catch(function (e) {
      busy = false;
      if (authFail(e)) return;
      say((e && e.message) || 'Could not save. Try again.', 'err'); paint();
    });
  }
  function load() {
    PM.api('lanes.load', { tournament_id: tid }).then(function (d) { D = d; document.title = (d.tournament.name || 'Tournament') + ' · Squads and Lanes'; paint(); }).catch(function (e) {
      if (authFail(e)) return;
      var head = document.getElementById('head'); head.replaceChildren(); head.setAttribute('aria-busy', 'false');
      say((e && e.message) || 'Could not load the lane draw.', 'err'); paint();
    });
  }

  // small dialog that can ask for a reason
  function ask(title, text, okLabel, needReason, danger) {
    return new Promise(function (resolve) {
      var dlg = h('dialog', { 'aria-labelledby': 'dlg-t' });
      var inp = needReason ? h('input', { class: 'pm-in', id: 'dlg-r', type: 'text', maxlength: '120', placeholder: 'For example: lane 3 is out of order', autocomplete: 'off' }) : null;
      var err = h('p', { style: 'font-size:14px;font-weight:600;color:#B42318', hidden: true, role: 'alert', text: 'A reason is required.' });
      var done = function (v) { dlg.close(); dlg.remove(); resolve(v); };
      dlg.append(h('div', { class: 'dlg' },
        h('h2', { class: 'pm-h', id: 'dlg-t', style: 'font-size:26px', text: title }),
        h('p', { style: 'font-size:15px;color:#33445C', text: text }),
        needReason ? h('div', null, h('label', { class: 'pm-lbl', for: 'dlg-r', text: 'Reason (required, goes in the log)' }), inp, err) : null,
        h('div', { class: 'dlg-act' },
          h('button', { class: 'pm-btn', type: 'button', onClick: function () { done(null); } }, 'Cancel'),
          h('button', { class: 'pm-btn ' + (danger ? 'pm-btn--danger' : 'pm-btn--pri'), type: 'button', onClick: function () {
            var v = inp ? inp.value.trim() : '';
            if (needReason && v.length < 3) { err.hidden = false; inp.focus(); return; }
            done(needReason ? v : '');
          } }, okLabel))));
      dlg.addEventListener('cancel', function (e) { e.preventDefault(); done(null); });
      document.body.append(dlg); dlg.showModal(); if (inp) inp.focus();
    });
  }

  function lock() {
    var first = !D.locked_at;
    ask(D.locked_at ? 'Refresh the entries?' : 'Lock the entries?',
      'This creates the Singles and Doubles entries from the registered bowlers and their Doubles partners. Bowlers without a partner get no Doubles entry. Nothing is drawn yet.', D.locked_at ? 'Refresh entries' : 'Lock entries', false).then(function (v) {
      if (v === null) return;
      run('entries.lock', {}, function (r) { return (first ? 'Entries locked' : 'Entries refreshed') + ': ' + r.sync.created + ' new, ' + r.sync.retired + ' removed.'; });
    });
  }
  function drawAll() {
    run('lanes.draw', { block_id: '*' }, function (r) { var n = (r.results || []).filter(function (x) { return x.status === 'drawn'; }).length; return n ? 'Lanes drawn for ' + n + (n === 1 ? ' block.' : ' blocks.') : 'Nothing to draw.'; });
  }
  function drawBlock(b, mode) {
    var running = ['live', 'paused'].indexOf(D.tournament.status) >= 0 && mode === 'full' && b.lots.length > 0;
    var q = mode === 'fill'
      ? ['Fill the gaps in ' + b.name + '?', 'Entries that have no lane get one. Lanes already drawn do not move.', 'Fill gaps', false, false]
      : b.lots.length
        ? ['Draw ' + b.name + ' again?', 'Every lane in this block is drawn again from scratch. Teams will see new lanes.', 'Draw again', running, true]
        : ['Draw ' + b.name + '?', 'Entries are placed on lanes ' + b.lane_from + ' to ' + b.lane_to + ' at random.', 'Draw lanes', false, false];
    ask(q[0], q[1], q[2], q[3], q[4]).then(function (v) {
      if (v === null) return;
      run('lanes.draw', { block_id: b.block_id, mode: mode, reason: v }, function () { return b.name + (mode === 'fill' ? ': gaps filled.' : ': lanes drawn.'); });
    });
  }

  var STATE = { drawn: ['Drawn', 'pm-tag--ok'], not_drawn: ['Not drawn', 'pm-tag--warn'], needs_check: ['Draw needs checking', 'pm-tag--warn'], empty: ['No entries', ''], 'n/a': ['Set after All Events', ''] };
  function tag(text, cls) { return h('span', { class: 'pm-tag' + (cls ? ' ' + cls : ''), text: text }); }
  function stat(n, l) { return h('div', null, h('b', { text: String(n) }), h('span', { text: l })); }
  function names(l) { return l.members.map(function (m) { return m.name; }).join(' & ') || '—'; }

  function blockCard(b) {
    var bad = b.state === 'needs_check';
    var sv = STATE[b.state] || ['', ''];
    var kids = [h('div', { class: 'ln-hd' },
      h('h3', { text: b.name }),
      h('div', { class: 'ln-tags' }, tag(b.start_time), tag(b.category + ' · ' + b.event), tag('Lanes ' + b.lane_from + ' to ' + b.lane_to), tag(sv[0], sv[1]), b.scored ? tag('Scores entered', 'pm-tag--off') : null))];
    if (b.state === 'n/a') { kids.push(h('p', { class: 'pm-help', text: 'Masters lanes are set after All Events, so there is nothing to draw here yet.' })); return h('section', { class: 'ln-blk' }, kids); }
    if (b.entries_n || b.lots.length) kids.push(h('p', { class: 'pm-help', style: 'margin:0', text: b.entries_n + (b.entries_n === 1 ? ' entry' : ' entries') + ' · ' + b.lanes_needed + ' of ' + b.lanes_have + ' lanes needed' + (b.lanes_needed > b.lanes_have ? ' (not enough lanes: change the lanes in Setup)' : '') }));
    if (b.lots.length) {
      kids.push(h('table', { class: 'pm-tbl' },
        h('thead', null, h('tr', null, h('th', { text: 'Lot' }), h('th', { text: 'Lane' }), h('th', { text: 'Team' }), h('th', { text: 'Bowlers' }))),
        h('tbody', null, b.lots.map(function (l) {
          var mine = user.role === 'team_manager' && l.team_id === user.team_id;
          return h('tr', { class: (l.orphan ? 'off ' : '') + (mine ? 'ln-mine' : '') },
            h('td', { 'data-l': 'Lot', text: String(l.lot_no) }),
            h('td', { 'data-l': 'Lane' }, h('span', { class: 'ln-lane', text: l.label })),
            h('td', { 'data-l': 'Team' }, l.team || '—', mine ? ' ' : null, mine ? tag('Your team') : null),
            h('td', { 'data-l': 'Bowlers' }, names(l), l.orphan ? ' ' : null, l.orphan ? tag('No longer entered', 'pm-tag--off') : null));
        }))));
    }
    if (b.missing.length) {
      kids.push(h('div', { class: 'pm-msg pm-msg--warn' },
        h('div', { text: 'No lane yet for ' + b.missing.length + (b.missing.length === 1 ? ' entry:' : ' entries:') }),
        h('div', { class: 'ln-miss' }, b.missing.map(function (e) { return h('span', { text: e.team + ' · ' + names(e) }); }))));
    }
    if (b.orphan) kids.push(h('div', { class: 'pm-msg pm-msg--warn', text: b.orphan + (b.orphan === 1 ? ' lane belongs' : ' lanes belong') + ' to an entry that has changed. Fill the gaps to free ' + (b.orphan === 1 ? 'it.' : 'them.') }));
    if (admin && D.locked_at && D.can_lock) {
      var acts = [];
      if (b.state === 'not_drawn') acts.push(h('button', { class: 'pm-btn pm-btn--pri', type: 'button', disabled: busy, onClick: function () { drawBlock(b, 'full'); } }, 'Draw lanes'));
      if (b.state === 'needs_check') acts.push(h('button', { class: 'pm-btn pm-btn--pri', type: 'button', disabled: busy, onClick: function () { drawBlock(b, 'fill'); } }, 'Fill gaps'));
      if (b.lots.length && !b.scored) acts.push(h('button', { class: 'pm-btn pm-btn--sm pm-btn--danger', type: 'button', disabled: busy, onClick: function () { drawBlock(b, 'full'); } }, 'Draw again'));
      if (acts.length) kids.push(h('div', { class: 'pm-act' }, acts));
    }
    return h('section', { class: 'ln-blk' + (bad ? ' ln-blk--check' : '') }, kids);
  }

  function paint() {
    var note = document.getElementById('note');
    note.replaceChildren(NOTE ? h('div', { class: 'pm-msg pm-msg--' + NOTE.kind, role: NOTE.kind === 'err' ? 'alert' : 'status', text: NOTE.text }) : '');
    var head = document.getElementById('head'), warn = document.getElementById('warn'), days = document.getElementById('days');
    if (!D) return;
    var t = D.tournament, bl = D.blocks;
    var drawable = bl.filter(function (b) { return b.state !== 'n/a'; });
    var nDrawn = drawable.filter(function (b) { return b.state === 'drawn'; }).length;
    var nTodo = bl.filter(function (b) { return b.state === 'not_drawn'; }).length;
    var nCheck = bl.filter(function (b) { return b.state === 'needs_check'; }).length;
    var kids = [
      h('div', { class: 'ln-tags' }, tag(PM.STATUS[t.status] || t.status, t.status === 'live' ? 'pm-tag--ok' : (t.status === 'regclosed' || t.status === 'paused' ? 'pm-tag--warn' : '')),
        D.locked_at ? tag('Entries locked', 'pm-tag--ok') : tag('Entries not locked', 'pm-tag--warn'),
        nCheck ? tag(nCheck + (nCheck === 1 ? ' block needs checking' : ' blocks need checking'), 'pm-tag--warn') : null),
      h('h1', { class: 'pm-h', style: 'font-size:44px;line-height:1.05', text: 'Squads and lanes' }),
      h('p', { style: 'color:var(--ink3)', text: t.name + (t.venue ? ' · ' + t.venue : '') + ' · ' + (t.lanes ? t.lanes + ' lanes' : 'lanes not set') + ' · ' + t.per_lane + ' per lane' }),
      h('div', { class: 'ln-stats' }, stat(drawable.length, 'Blocks to draw'), stat(nDrawn, 'Drawn'), stat(nTodo, 'Not drawn'), stat(nCheck, 'Need checking'))];
    if (admin) {
      var bar = [];
      if (!D.can_lock) bar.push(h('p', { class: 'pm-help', style: 'margin:0', text: 'Close registration in Tournament setup first. The lane draw is made after registration closes.' }));
      else {
        bar.push(h('button', { class: D.locked_at ? 'pm-btn' : 'pm-btn pm-btn--pri', type: 'button', disabled: busy, onClick: lock }, D.locked_at ? 'Refresh entries' : 'Lock entries'));
        if (D.locked_at) bar.push(h('button', { class: 'pm-btn pm-btn--pri', type: 'button', disabled: busy || !nTodo, onClick: drawAll }, nTodo ? 'Draw all ' + nTodo + ' undrawn ' + (nTodo === 1 ? 'block' : 'blocks') : 'Nothing left to draw'));
        if (!D.locked_at) bar.push(h('p', { class: 'pm-help', style: 'margin:0;flex:1 1 280px', text: 'Locking creates the Singles and Doubles entries from the registered bowlers and their partners. After that, team changes go through a changes window that you open on the Participants page.' }));
      }
      kids.push(h('div', { class: 'ln-bar' }, bar));
    } else {
      kids.push(h('p', { class: 'pm-help', style: 'margin:0', text: D.locked_at ? 'Read only. The Admin makes and changes the lane draw.' : 'The lane draw has not been made yet.' }));
    }
    head.replaceChildren.apply(head, kids.filter(Boolean)); head.setAttribute('aria-busy', 'false');
    warn.replaceChildren.apply(warn, D.warnings.length && admin ? [h('div', { style: 'display:flex;flex-direction:column;gap:8px' }, D.warnings.map(function (w) { return h('div', { class: 'pm-msg pm-msg--warn', text: w.text }); }))] : []);
    var byDay = {};
    bl.forEach(function (b) { (byDay[b.day] = byDay[b.day] || []).push(b); });
    var out = Object.keys(byDay).map(Number).sort(function (a, b) { return a - b; }).map(function (d) {
      return h('section', { class: 'ln-day' }, h('h2', { class: 'pm-h', style: 'font-size:28px', text: 'Day ' + d }), byDay[d].map(blockCard));
    });
    if (!bl.length) out = [h('div', { class: 'pm-card' }, h('p', { text: 'No blocks are scheduled yet. The Admin adds them in Tournament setup.' }))];
    days.replaceChildren.apply(days, out);
  }

  document.getElementById('out').addEventListener('click', function () {
    PM.api('auth.logout').catch(function () {}).finally(function () { PM.setSession(null); location.replace('login.html'); });
  });
  load();
})();
</script>
</body>
</html>
