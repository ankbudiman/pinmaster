<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Entry · Pin Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pm.css">
<style>
.sc-nav a{color:#C9D4E5;text-decoration:none;font-size:14px;font-weight:600}
.sc-nav a:hover{color:#fff;text-decoration:underline}
.sc-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.sc-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.sc-tab{height:44px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-weight:600;font-size:15px;color:var(--ink3);cursor:pointer}
.sc-tab[aria-current=page]{color:var(--navy);border-bottom-color:#F2A93B}
.sc-lane{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700;font-size:22px;white-space:nowrap}
.sc-in{width:84px;height:44px;text-align:center;font:700 20px 'Barlow Condensed','Arial Narrow',sans-serif;border:1px solid var(--field);border-radius:8px}
.sc-in[aria-invalid=true]{border-color:#B42318;background:#FDECEA}
.sc-in:disabled{background:#F1F4F8;color:var(--ink2)}
.sc-sum{font-size:14px;color:var(--ink2)}
.sc-off{background:#FFF3D6;border:1px solid #E7C16A;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.sc-note{font-size:13px;color:var(--warn);font-weight:600}
.sc-num{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header class="pm-top">
  <svg width="18" height="23" viewBox="0 0 22 28" aria-hidden="true"><circle cx="11" cy="14" r="9" fill="#F2A93B"/></svg>
  <span class="pm-brand" style="font-size:22px">PIN MASTER</span>
  <nav class="sc-nav" aria-label="Breadcrumb"><a id="dashl" href="tournament.html">&larr; Dashboard</a></nav>
  <span class="sp"></span>
  <span id="who" style="font-size:14px;color:#C9D4E5"></span>
  <button class="pm-btn" id="out" type="button">Sign out</button>
</header>
<main class="pm-wrap">
  <div id="msg" aria-live="polite"></div>
  <div id="off"></div>
  <section class="pm-card" id="main" aria-busy="true"><p class="pm-help">Loading scores…</p></section>
</main>
<script src="config.js"></script>
<script src="pm.js"></script>
<script>
(function () {
  var PM = window.PM, h = PM.h;
  var sess = PM.getSession();
  if (!sess || !sess.user) { PM.goLogin(); return; }
  var user = sess.user, admin = user.role === 'admin';
  if (!admin && user.role !== 'marshal') { location.replace(PM.home(user)); return; }
  var tid = admin ? (PM.q('t') || PM.pref('tid') || '') : (user.tournament_id || '');
  if (!tid) { location.replace(admin ? 'hub.html' : 'login.html'); return; }
  if (admin) PM.pref('tid', tid);
  document.getElementById('who').textContent = user.display_name || user.login_id;
  document.getElementById('dashl').href = PM.link('tournament.html', tid);
  document.getElementById('out').addEventListener('click', function () { PM.api('auth.logout').catch(function () {}).then(function () { PM.setSession(null); location.replace('login.html'); }); });

  var D = null, tab = 'score', blockId = '', game = 1, find = '', busy = false, MSG = null, offline = false, flushing = false;
  var drafts = {}, queue = [], bad = {};
  var QK = 'pm.sq.' + tid;
  try { queue = JSON.parse(localStorage.getItem(QK) || '[]') || []; } catch (e) { queue = []; }
  function saveQueue() { try { localStorage.setItem(QK, JSON.stringify(queue)); } catch (e) {} }

  function authFail(e) { if (e && (e.code === 'auth' || e.code === 'must_change_pin')) { PM.goLogin(true); return true; } return false; }
  function say(t, k) { MSG = t ? { t: t, k: k || 'ok' } : null; }
  function key(b, g, r) { return b + '|' + g + '|' + r.entry_id + '|' + r.athlete_id; }
  function valid(v) { return /^\d{1,3}$/.test(v) && +v <= 300; }

  var byKey = {};
  function index() { byKey = {}; D.scores.forEach(function (s) { byKey[s.block_id + '|' + s.game_no + '|' + s.entry_id + '|' + s.athlete_id] = s; }); }
  function curBlock() { return D.blocks.filter(function (b) { return b.block_id === blockId; })[0] || D.blocks[0]; }
  function isQueued(k) { return queue.some(function (q) { return key(q.block_id, q.game_no, q) === k; }); }

  // Rows of one block: one per bowler, or one per team for Baker.
  function rowsOf(b) {
    var out = [];
    b.lots.forEach(function (l) {
      if (l.orphan) return;
      if (b.baker) out.push({ entry_id: l.entry_id, athlete_id: '', lane: l.label, ls: l.lane_start, id: 'Team ' + l.entry_no, name: l.members.map(function (m) { return m.name; }).join(' & '), team: l.team, sub: '' });
      else l.members.forEach(function (m) { out.push({ entry_id: l.entry_id, athlete_id: m.athlete_id, lane: l.label, ls: l.lane_start, id: m.code, name: m.name, team: l.team }); });
    });
    return out.sort(function (a, c) { return (a.ls - c.ls) || String(a.lane).localeCompare(String(c.lane)) || a.name.localeCompare(c.name); });
  }
  function status(b, g, r) {
    var k = key(b.block_id, g, r), rec = byKey[k], d = drafts[k];
    if (rec && rec.state === 'locked') return 'locked';
    if (isQueued(k)) return 'queued';
    if (d !== undefined && d !== String(rec ? rec.pins : '')) return 'draft';
    return rec ? rec.state : 'empty';
  }
  var ST = { empty: ['No score', ''], draft: ['Not sent', 'pm-tag--warn'], queued: ['Waiting for signal', 'pm-tag--warn'], entered: ['Submitted', ''], returned: ['Sent back', 'pm-tag--off'], locked: ['Locked', 'pm-tag--ok'] };
  function tag(s) { return h('span', { class: 'pm-tag' + (ST[s][1] ? ' ' + ST[s][1] : ''), text: ST[s][0] }); }
  function canEdit(s) {
    if (s === 'locked' || s === 'queued') return false;
    if (admin) return true;
    return D.tournament.status === 'live' && (s === 'empty' || s === 'draft' || s === 'returned');
  }

  // ---------- server ----------
  function load(quiet) {
    return PM.api('scores.load', { tournament_id: tid }).then(function (d) {
      D = d; index(); document.title = (d.tournament.name || 'Tournament') + ' · Score Entry';
      if (!blockId || !D.blocks.some(function (b) { return b.block_id === blockId; })) { blockId = D.blocks.length ? D.blocks[0].block_id : ''; game = 1; }
      offline = false; paint();
    }).catch(function (e) {
      if (authFail(e)) return;
      if (e && e.code === 'network') { offline = true; paint(); return; }
      if (!quiet) { say((e && e.message) || 'Could not load scores.', 'err'); paint(); }
    });
  }
  function flush() {
    if (flushing || !queue.length) return Promise.resolve();
    flushing = true;
    var batch = queue.slice(0, 50);
    return PM.api('scores.save', { tournament_id: tid, rows: batch }).then(function (r) {
      var errs = [];
      r.results.forEach(function (x, i) { if (x.status === 'error') errs.push(batch[i].lane_label + ': ' + x.error); });
      queue = queue.slice(batch.length); saveQueue(); flushing = false; offline = false;
      batch.forEach(function (q) { delete drafts[key(q.block_id, q.game_no, q)]; });
      say(errs.length ? 'Some scores were not accepted: ' + errs.slice(0, 4).join('; ') : (batch.length + (batch.length === 1 ? ' score was' : ' scores were') + ' sent to the Admin. They are unofficial until locked.'), errs.length ? 'warn' : 'ok');
      return queue.length ? flush() : load();
    }).catch(function (e) {
      flushing = false;
      if (authFail(e)) return;
      if (e && e.code === 'network') { offline = true; paint(); return; }
      queue = queue.slice(batch.length); saveQueue();   // the server refused these rows: do not retry forever
      say((e && e.message) || 'Scores were not accepted.', 'err'); load();
    });
  }
  function submit(b, g) {
    var rows = rowsOf(b), add = [], badKeys = {};
    rows.forEach(function (r) {
      var k = key(b.block_id, g, r), d = drafts[k];
      if (d === undefined || status(b, g, r) !== 'draft') return;
      if (!valid(d)) { badKeys[k] = true; return; }
      add.push({ block_id: b.block_id, game_no: g, event_key: b.event_key, entry_id: r.entry_id, athlete_id: r.athlete_id, lane_label: r.lane, pins: +d });
    });
    bad = badKeys;
    if (Object.keys(badKeys).length) { say('Fix the red scores first. Use a whole number from 0 to 300.', 'err'); paint(); return; }
    if (!add.length) { say('Nothing new to send.', 'warn'); paint(); return; }
    queue = queue.concat(add); saveQueue(); say(''); paint(); flush();
  }
  function review(op, params, okText) {
    if (busy) return;
    busy = true; say('');
    PM.api('scores.review', Object.assign({ tournament_id: tid, op: op }, params)).then(function (r) {
      busy = false; say(r.changed ? okText(r) : 'Nothing to change.', r.changed ? 'ok' : 'warn'); return load();
    }).catch(function (e) { busy = false; if (authFail(e)) return; say((e && e.message) || 'Could not save.', 'err'); paint(); });
  }
  function ask(title, text, okLabel, needReason) {
    return new Promise(function (resolve) {
      var dlg = h('dialog', { 'aria-labelledby': 'dlg-t' });
      var inp = needReason ? h('input', { class: 'pm-in', id: 'dlg-r', type: 'text', maxlength: '120', autocomplete: 'off', placeholder: 'For example: scorer typed the wrong lane' }) : null;
      var err = h('p', { style: 'font-size:14px;font-weight:600;color:#B42318', hidden: true, role: 'alert', text: 'A reason is required.' });
      var done = function (v) { dlg.close(); dlg.remove(); resolve(v); };
      dlg.append(h('div', { class: 'dlg' }, h('h2', { class: 'pm-h', id: 'dlg-t', style: 'font-size:26px', text: title }), h('p', { style: 'font-size:15px;color:#33445C', text: text }),
        needReason ? h('div', null, h('label', { class: 'pm-lbl', for: 'dlg-r', text: 'Reason (required, goes in the audit trail)' }), inp, err) : null,
        h('div', { class: 'dlg-act' }, h('button', { class: 'pm-btn', type: 'button', onClick: function () { done(null); } }, 'Cancel'),
          h('button', { class: 'pm-btn pm-btn--pri', type: 'button', onClick: function () { var v = inp ? inp.value.trim() : ''; if (needReason && v.length < 3) { err.hidden = false; inp.focus(); return; } done(v); } }, okLabel))));
      dlg.addEventListener('cancel', function (e) { e.preventDefault(); done(null); });
      document.body.append(dlg); dlg.showModal(); if (inp) inp.focus();
    });
  }

  // ---------- views ----------
  function chips(items, cur, pick, label) {
    return h('div', { class: 'sc-row', role: 'group', 'aria-label': label }, items.map(function (x) {
      return h('button', { class: 'pm-chip', type: 'button', 'aria-pressed': x.id === cur ? 'true' : 'false', onClick: function () { pick(x.id); } }, x.label);
    }));
  }
  function scoreView(b) {
    var out = [];
    if (b.event_key === 'a' || b.event_key === 'm') return [h('p', { class: 'pm-help', text: b.event_key === 'm' ? 'Masters opens after All Events is ranked. Qualifiers and lanes appear here then.' : 'All Events scores come from the Singles, Doubles and team blocks. Nothing is entered here.' })];
    var rows = rowsOf(b);
    if (!rows.length) return [h('p', { class: 'pm-help', text: b.state === 'not_drawn' ? 'Lanes are not drawn for this block yet. The Admin does this in Squads & Lanes.' : 'No bowlers in this block.' })];
    var G = b.games, g = Math.min(game, G);
    out.push(chips(Array.apply(null, Array(G)).map(function (_, i) { return { id: i + 1, label: 'Game ' + (i + 1) }; }), g, function (v) { game = v; paint(); }, 'Game'));
    var cnt = { empty: 0, draft: 0, queued: 0, entered: 0, returned: 0, locked: 0 };
    rows.forEach(function (r) { cnt[status(b, g, r)]++; });
    var nDraft = cnt.draft;
    out.push(h('div', { class: 'sc-row' },
      h('span', { class: 'sc-sum', text: rows.length + ' rows · ' + cnt.locked + ' locked · ' + cnt.entered + ' submitted · ' + cnt.returned + ' sent back · ' + (cnt.empty + cnt.draft) + ' to do' }),
      h('span', { style: 'flex:1' }),
      h('label', { class: 'pm-lbl', for: 'find', style: 'margin:0', text: 'Find a player' }),
      h('input', { class: 'pm-in', id: 'find', type: 'search', value: find, style: 'width:200px', autocomplete: 'off', onInput: function (e) { find = e.target.value; paintRows(); } }),
      h('button', { class: 'pm-btn pm-btn--pri', type: 'button', id: 'submit', disabled: !nDraft, onClick: function () { submit(b, g); } }, 'Submit game' + (nDraft ? ' (' + nDraft + ')' : '')),
      admin ? h('button', { class: 'pm-btn', type: 'button', id: 'lockg', disabled: !cnt.entered, onClick: function () {
        ask('Lock Game ' + g + '?', cnt.entered + ' submitted scores in ' + b.name + ' become official.', 'Lock game', false).then(function (v) { if (v !== null) review('lock', { block_id: b.block_id, game_no: g }, function (r) { return r.changed + ' scores locked as official.'; }); });
      } }, 'Lock game') : null,
      admin ? h('button', { class: 'pm-btn', type: 'button', id: 'locka', disabled: !D.scores.some(function (s) { return s.block_id === b.block_id && s.state === 'entered'; }), onClick: function () {
        ask('Lock every game in ' + b.name + '?', 'All submitted scores in this block become official.', 'Lock all games', false).then(function (v) { if (v !== null) review('lock', { block_id: b.block_id }, function (r) { return r.changed + ' scores locked as official.'; }); });
      } }, 'Lock all games') : null));
    if (D.tournament.status !== 'live' && !admin) out.push(h('p', { class: 'sc-off', text: 'Scores can be entered while the tournament is Live. It is ' + (PM.STATUS[D.tournament.status] || D.tournament.status) + ' now.' }));
    out.push(h('div', { id: 'rows' }));
    return out;
  }
  function paintRows() {
    var box = document.getElementById('rows'); if (!box) return;
    var b = curBlock(), g = Math.min(game, b.games), q = find.trim().toLowerCase();
    var rows = rowsOf(b).filter(function (r) { return !q || (r.name + ' ' + r.id + ' ' + r.team + ' ' + r.lane).toLowerCase().indexOf(q) >= 0; });
    if (!rows.length) { box.replaceChildren(h('p', { class: 'pm-help', text: 'No player matches that search in this block.' })); return; }
    var inputs = [];
    var trs = rows.map(function (r) {
      var k = key(b.block_id, g, r), rec = byKey[k], s = status(b, g, r), v = drafts[k] !== undefined ? drafts[k] : (rec ? String(rec.pins) : '');
      var stTd = h('td', { 'data-l': 'Status' });
      var inp = h('input', { class: 'sc-in', type: 'text', inputmode: 'numeric', maxlength: '3', value: v, disabled: !canEdit(s), 'aria-label': 'Score for ' + r.name + ', game ' + g, 'aria-invalid': bad[k] ? 'true' : 'false',
        onInput: function (e) { drafts[k] = e.target.value.trim(); delete bad[k]; e.target.setAttribute('aria-invalid', 'false'); stTd.replaceChildren(tag(status(b, g, r))); var sb = document.getElementById('submit'); if (sb) { var n = rowsOf(b).filter(function (x) { return status(b, g, x) === 'draft'; }).length; sb.disabled = !n; sb.textContent = 'Submit game' + (n ? ' (' + n + ')' : ''); } },
        onKeydown: function (e) { if (e.key === 'Enter') { e.preventDefault(); var i = inputs.indexOf(e.target); for (var j = i + 1; j < inputs.length; j++) if (!inputs[j].disabled) { inputs[j].focus(); return; } } } });
      inputs.push(inp);
      var acts = [];
      if (admin && s === 'entered') {
        acts.push(h('button', { class: 'pm-btn pm-btn--sm', type: 'button', onClick: function () { review('lock', { score_ids: [rec.score_id] }, function () { return 'Locked.'; }); } }, 'Lock'));
        acts.push(h('button', { class: 'pm-btn pm-btn--sm', type: 'button', onClick: function () { ask('Send back?', r.name + ', Game ' + g + ' goes back to the marshal.', 'Send back', true).then(function (why) { if (why !== null) review('sendback', { score_ids: [rec.score_id], reason: why }, function () { return 'Sent back.'; }); }); } }, 'Send back'));
      }
      if (admin && s === 'locked') acts.push(h('button', { class: 'pm-btn pm-btn--sm', type: 'button', onClick: function () { ask('Reopen to correct?', r.name + ', Game ' + g + ' is no longer official until locked again.', 'Reopen', true).then(function (why) { if (why !== null) review('reopen', { score_ids: [rec.score_id], reason: why }, function () { return 'Reopened.'; }); }); } }, 'Reopen'));
      return h('tr', null,
        h('td', { 'data-l': 'Lane' }, h('span', { class: 'sc-lane', text: r.lane })), h('td', { 'data-l': 'ID', text: r.id }), h('td', { 'data-l': 'Player', text: r.name }), h('td', { 'data-l': 'Team', text: r.team }),
        h('td', { 'data-l': 'Score' }, inp),
        (stTd.append(tag(s)), s === 'returned' && rec && rec.note ? stTd.append(h('div', { class: 'sc-note', text: rec.note })) : null, stTd),
        h('td', { class: 'act' }, h('div', { class: 'pm-act' }, acts)));
    });
    box.replaceChildren(h('table', { class: 'pm-tbl' }, h('thead', null, h('tr', null, ['Lane', 'ID', 'Player', 'Team', 'Score', 'Status', ''].map(function (t) { return h('th', { text: t }); }))), h('tbody', null, trs)));
  }
  function totalsView(b) {
    if (b.event_key === 'm') return [h('p', { class: 'pm-help', text: 'Blank. Qualifiers come from All Events once Singles and Doubles are finished.' })];
    if (b.event_key === 'a') return [h('p', { class: 'pm-help', text: 'All Events totals are worked out from the other blocks once the rule sheet is set.' })];
    var rows = rowsOf(b), G = b.games, anyOpen = false;
    var list = rows.map(function (r) {
      var vals = [], tot = 0, n = 0;
      for (var g = 1; g <= G; g++) { var rec = byKey[key(b.block_id, g, r)]; if (rec) { vals.push(rec.pins); tot += rec.pins; n++; if (rec.state !== 'locked') anyOpen = true; } else vals.push(null); }
      return { r: r, vals: vals, tot: tot, n: n, avg: n ? tot / n : 0 };
    });
    var ranked = list.filter(function (x) { return x.n; }).sort(function (a, c) { return c.tot - a.tot || c.avg - a.avg; });
    var rest = list.filter(function (x) { return !x.n; });
    var head = ['Rank', 'Player', 'Team'].concat(Array.apply(null, Array(G)).map(function (_, i) { return 'G' + (i + 1); }), ['Total', 'Avg']);
    var pos = 0;
    var tr = function (x, rank) { return h('tr', null, h('td', { text: rank }), h('td', { text: x.r.name }), h('td', { text: x.r.team }), x.vals.map(function (v) { return h('td', { class: 'sc-num', text: v == null ? '' : String(v) }); }), h('td', { class: 'sc-num', text: x.n ? String(x.tot) : '' }), h('td', { class: 'sc-num', text: x.n ? x.avg.toFixed(1) : '' })); };
    var out = [h('p', { class: 'pm-help', style: 'margin:0', text: (anyOpen ? 'Includes scores that are submitted but not locked yet. ' : '') + 'Plain pin totals. Handicap and tie-breaks are added when the rule sheet is set.' })];
    if (!rows.length) return out.concat([h('p', { class: 'pm-help', text: 'No lanes drawn for this block yet.' })]);
    out.push(h('table', { class: 'pm-tbl', id: 'tot' }, h('thead', null, h('tr', null, head.map(function (t) { return h('th', { text: t }); }))),
      h('tbody', null, ranked.map(function (x, i) { var same = i > 0 && ranked[i - 1].tot === x.tot; if (!same) pos = i + 1; return tr(x, String(pos)); }).concat(rest.map(function (x) { return tr(x, '–'); })))));
    return out;
  }
  function logView() {
    if (!D.log.length) return [h('p', { class: 'pm-help', text: 'Nothing yet. Every entry, check, send back, lock and correction will be listed here.' })];
    return [h('p', { class: 'pm-help', style: 'margin:0', text: 'Every entry, check, send back, lock and correction, with who and when.' }),
      h('table', { class: 'pm-tbl', id: 'log' }, h('thead', null, h('tr', null, ['When', 'What', 'Details', 'Who'].map(function (t) { return h('th', { text: t }); }))),
        h('tbody', null, D.log.map(function (l) { return h('tr', null, h('td', { 'data-l': 'When', text: PM.fmtTime(l.at) }), h('td', { 'data-l': 'What', text: (l.tag || '').replace('score_', '').replace('scores_', '') }), h('td', { 'data-l': 'Details', text: l.text }), h('td', { 'data-l': 'Who', text: l.who })); })))];
  }

  function paint() {
    var m = document.getElementById('msg'), off = document.getElementById('off'), main = document.getElementById('main');
    m.replaceChildren.apply(m, MSG ? [h('div', { class: 'pm-msg pm-msg--' + MSG.k, role: MSG.k === 'err' ? 'alert' : 'status' }, MSG.t, ' ', h('button', { class: 'pm-btn pm-btn--sm', type: 'button', onClick: function () { say(''); paint(); } }, 'Dismiss'))] : []);
    off.replaceChildren.apply(off, (offline || queue.length) ? [h('div', { class: 'sc-off', role: 'status', id: 'offbar' }, offline ? 'No signal. Keep scoring. Changes are saved on this device and sent when the signal returns. ' : 'Sending… ', queue.length + ' waiting.')] : []);
    main.setAttribute('aria-busy', D ? 'false' : 'true');
    if (!D) { return; }
    var b = curBlock(), t = D.tournament;
    var kids = [h('div', { class: 'sc-row' }, h('h1', { class: 'pm-h', style: 'font-size:34px', text: 'Score entry' }), h('span', { class: 'pm-tag', text: PM.STATUS[t.status] || t.status }), h('span', { class: 'pm-tag', text: admin ? 'Admin' : 'Marshal' })),
      h('p', { class: 'pm-help', style: 'margin:0', text: t.name + (t.venue ? ' · ' + t.venue : '') }),
      h('div', { class: 'sc-tabs', role: 'tablist' }, [['score', 'Score entry'], ['totals', 'Totals'], ['log', 'Audit trail']].map(function (x) {
        return h('button', { class: 'sc-tab', type: 'button', 'aria-current': tab === x[0] ? 'page' : 'false', onClick: function () { tab = x[0]; say(''); paint(); } }, x[1]);
      }))];
    if (tab !== 'log') {
      if (!D.blocks.length) kids.push(h('p', { class: 'pm-help', text: 'No blocks are set up for this tournament.' }));
      else {
        kids.push(chips(D.blocks.map(function (x) { return { id: x.block_id, label: x.name }; }), b.block_id, function (v) { blockId = v; game = 1; find = ''; bad = {}; paint(); }, 'Block'));
        kids.push(h('h2', { class: 'pm-h', style: 'font-size:24px', text: b.name + ' · ' + b.category + ' · ' + b.event + ' · ' + b.games + (b.games === 1 ? ' game' : ' games') }));
        kids = kids.concat(tab === 'score' ? scoreView(b) : totalsView(b));
      }
    } else kids = kids.concat(logView());
    main.replaceChildren.apply(main, kids);
    if (tab === 'score') paintRows();
  }

  window.addEventListener('online', function () { flush(); });
  var tick = 0;
  setInterval(function () { tick++; if (queue.length) flush(); else if (tick % 4 === 0 && D && !busy && !(document.activeElement && document.activeElement.tagName === 'INPUT')) load(true); }, 8000);
  load().then(function () { if (queue.length) flush(); });
})();
</script>
